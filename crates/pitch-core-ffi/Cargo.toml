[package]
name = "pitch-core-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "cxx FFI bridge exposing pitch-core to the C++/JUCE plugin, for Phase 3 hot-swap. pitch-core itself stays FFI-free — see its lib.rs doc comment."

[lib]
# Static lib only: this crate is linked directly into the JUCE plugin
# binary via Corrosion (cpp-plugin/CMakeLists.txt), not loaded as a
# separate shared object at runtime.
crate-type = ["staticlib"]

[dependencies]
pitch-core = { path = "../pitch-core" }
cxx = "1"

[build-dependencies]
cxx-build = "1"
