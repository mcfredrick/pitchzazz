<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" role="img" aria-label="Phase vocoder shifts pitch by moving frequency-domain bins after an FFT, with latency fixed to its analysis window. TD-PSOLA shifts pitch by re-spacing time-domain grains at pitch marks, with latency bounded by grain width and pitch-dependent. Both share the same input and output.">
  <title>Phase vocoder vs. TD-PSOLA: where the shift actually happens</title>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8d9c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="300" fill="#12141a"/>

  <rect x="20" y="70" width="120" height="160" rx="10" fill="#1b1e27" stroke="#2c3140" stroke-width="1.4"/>
  <text x="80" y="152" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#f1f1f6">input</text>

  <rect x="1040" y="70" width="120" height="160" rx="10" fill="#1b1e27" stroke="#2c3140" stroke-width="1.4"/>
  <text x="1100" y="152" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#f1f1f6">output</text>

  <text x="180" y="55" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" letter-spacing="0.04em" fill="#8a8d9c">PHASE VOCODER · frequency domain</text>
  <rect x="180" y="65" width="180" height="58" rx="8" fill="#1b1e27" stroke="#2c3140" stroke-width="1.4"/>
  <text x="270" y="98" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#f1f1f6">analysis window</text>
  <rect x="400" y="65" width="180" height="58" rx="8" fill="#1b1e27" stroke="#39ff88" stroke-width="2"/>
  <text x="490" y="98" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#39ff88">shift bins</text>
  <rect x="620" y="65" width="180" height="58" rx="8" fill="#1b1e27" stroke="#2c3140" stroke-width="1.4"/>
  <text x="710" y="98" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#f1f1f6">IFFT + overlap-add</text>
  <text x="490" y="140" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-style="italic" fill="#8a8d9c">latency = window — fixed at every pitch</text>

  <text x="180" y="172" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" letter-spacing="0.04em" fill="#8a8d9c">TD-PSOLA · time domain</text>
  <rect x="180" y="182" width="180" height="58" rx="8" fill="#1b1e27" stroke="#2c3140" stroke-width="1.4"/>
  <text x="270" y="215" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#f1f1f6">find pitch marks</text>
  <rect x="400" y="182" width="180" height="58" rx="8" fill="#1b1e27" stroke="#39ff88" stroke-width="2"/>
  <text x="490" y="215" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#39ff88">re-space grains</text>
  <rect x="620" y="182" width="180" height="58" rx="8" fill="#1b1e27" stroke="#2c3140" stroke-width="1.4"/>
  <text x="710" y="215" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#f1f1f6">overlap-add</text>
  <text x="490" y="258" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-style="italic" fill="#8a8d9c">latency = grain width — pitch-dependent</text>

  <line x1="140" y1="150" x2="176" y2="94" stroke="#8a8d9c" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <line x1="140" y1="150" x2="176" y2="211" stroke="#8a8d9c" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <line x1="360" y1="94" x2="396" y2="94" stroke="#8a8d9c" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <line x1="580" y1="94" x2="616" y2="94" stroke="#8a8d9c" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <line x1="360" y1="211" x2="396" y2="211" stroke="#8a8d9c" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <line x1="580" y1="211" x2="616" y2="211" stroke="#8a8d9c" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <line x1="800" y1="94" x2="1036" y2="150" stroke="#8a8d9c" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <line x1="800" y1="211" x2="1036" y2="150" stroke="#8a8d9c" stroke-width="1.3" marker-end="url(#arrow2)"/>
</svg>
