<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 280" role="img" aria-label="Phase vocoder shifts pitch by moving frequency-domain bins after an FFT, with latency fixed to the analysis window. TD-PSOLA shifts pitch by re-spacing time-domain grains at pitch marks, with latency bounded by grain width and pitch-dependent.">
  <title>Phase vocoder vs. TD-PSOLA: where they actually diverge</title>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="280" fill="#f7f6f3"/>

  <!-- Shared input -->
  <rect x="20" y="35" width="150" height="195" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="95" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1f2328">Input audio</text>
  <text x="95" y="146" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">(mono)</text>

  <!-- Shared output -->
  <rect x="800" y="35" width="160" height="195" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="880" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1f2328">Output audio</text>
  <text x="880" y="146" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">pitch-shifted</text>

  <!-- Lane A label -->
  <text x="190" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#1f2328">Phase Vocoder &#8212; frequency domain</text>

  <!-- Lane A boxes, y 35-105, midline 70 -->
  <rect x="190" y="35" width="180" height="70" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="280" y="65" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#1f2328">Analysis window</text>
  <text x="280" y="82" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">~46-50ms, FFT</text>

  <rect x="400" y="35" width="190" height="70" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2.5"/>
  <text x="495" y="65" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#1f2328">Shift bins</text>
  <text x="495" y="82" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c2410c">frequency domain</text>

  <rect x="620" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="695" y="65" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#1f2328">IFFT</text>
  <text x="695" y="82" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">+ overlap-add</text>

  <text x="480" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#555">latency = analysis window &#8212; fixed, same at every pitch</text>

  <!-- Lane A arrows -->
  <line x1="170" y1="70" x2="186" y2="70" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="370" y1="70" x2="396" y2="70" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="590" y1="70" x2="616" y2="70" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="770" y1="70" x2="796" y2="70" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Lane B label -->
  <text x="190" y="152" font-family="sans-serif" font-size="12" font-weight="700" fill="#1f2328">TD-PSOLA &#8212; time domain, grain-based</text>

  <!-- Lane B boxes, y 160-230, midline 195 -->
  <rect x="190" y="160" width="180" height="70" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="280" y="190" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#1f2328">Find pitch marks</text>
  <text x="280" y="207" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">one per period</text>

  <rect x="400" y="160" width="190" height="70" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2.5"/>
  <text x="495" y="190" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#1f2328">Re-space grains</text>
  <text x="495" y="207" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c2410c">time domain</text>

  <rect x="620" y="160" width="150" height="70" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="695" y="190" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#1f2328">Overlap-add</text>
  <text x="695" y="207" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">in time domain</text>

  <text x="480" y="248" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#555">latency = grain width &#8212; pitch-dependent, bounded by a floor Hz</text>

  <!-- Lane B arrows -->
  <line x1="170" y1="195" x2="186" y2="195" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="370" y1="195" x2="396" y2="195" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="590" y1="195" x2="616" y2="195" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="770" y1="195" x2="796" y2="195" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow3)"/>
</svg>
