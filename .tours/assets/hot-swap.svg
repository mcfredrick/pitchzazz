<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 220" role="img" aria-label="The UI picks an engine, which is constructed off the audio thread and stored into one atomic pointer. The worker thread picks it up on its next block via an acquire exchange, then crossfades from the old engine to the new one over four blocks, equal-power.">
  <title>Hot-swap: atomic pointer handoff, picked up between blocks</title>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8d9c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="220" fill="#12141a"/>

  <rect x="20" y="70" width="160" height="70" rx="10" fill="#1b1e27" stroke="#2c3140" stroke-width="1.4"/>
  <text x="100" y="99" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#f1f1f6">UI: pick engine</text>
  <text x="100" y="115" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#8a8d9c">message thread</text>

  <rect x="230" y="70" width="190" height="70" rx="10" fill="#1b1e27" stroke="#2c3140" stroke-width="1.4"/>
  <text x="325" y="99" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#f1f1f6">requestEngineSwap()</text>
  <text x="325" y="115" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#8a8d9c">construct off-thread</text>

  <rect x="470" y="65" width="160" height="80" rx="10" fill="#1b1e27" stroke="#ff3fa4" stroke-width="2"/>
  <text x="550" y="97" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#ff3fa4">pendingEngine</text>
  <text x="550" y="113" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#8a8d9c">atomic pointer</text>

  <rect x="680" y="70" width="180" height="70" rx="10" fill="#1b1e27" stroke="#2c3140" stroke-width="1.4"/>
  <text x="770" y="99" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#f1f1f6">worker, next block</text>
  <text x="770" y="115" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#8a8d9c">exchange (acquire)</text>

  <rect x="910" y="65" width="200" height="80" rx="10" fill="#1b1e27" stroke="#39ff88" stroke-width="2"/>
  <text x="1010" y="97" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#39ff88">crossfade, 4 blocks</text>
  <text x="1010" y="113" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#8a8d9c">old → new, equal-power</text>

  <line x1="180" y1="105" x2="226" y2="105" stroke="#8a8d9c" stroke-width="1.4" marker-end="url(#arrow3)"/>
  <line x1="420" y1="105" x2="466" y2="105" stroke="#8a8d9c" stroke-width="1.4" marker-end="url(#arrow3)"/>
  <text x="443" y="94" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#8a8d9c">store (release)</text>
  <line x1="630" y1="105" x2="676" y2="105" stroke="#8a8d9c" stroke-width="1.4" marker-end="url(#arrow3)"/>
  <line x1="860" y1="105" x2="906" y2="105" stroke="#8a8d9c" stroke-width="1.4" marker-end="url(#arrow3)"/>

  <text x="595" y="190" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" font-style="italic" fill="#8a8d9c">never touched mid-process() · never blocks the audio thread</text>
</svg>
